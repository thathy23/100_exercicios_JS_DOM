<!-- 1 - Crie uma página que calcule a média de quatro notas inseridas pelo usuário.
 Exiba se o aluno foi aprovado (média >= 7) ou reprovado (média < 7). -->

 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Médias</title>
 </head>
 <body>

    <h1>Calcule sua Média!</h1>
    <p>Insira suas 4 notas: </p>

    <form id="formNotas" onsubmit="calcularMedia(); return false;">
        <input type="number" id="nota1" placeholder="Nota 1" required><br><br>
        <input type="number" id="nota2" placeholder="Nota 2" required><br><br>
        <input type="number" id="nota3" placeholder="Nota 3" required><br><br>
        <input type="number" id="nota4" placeholder="Nota 4" required><br><br>
        <button type="submit">Calcular Média</button>
        <button type="button" onclick="limparCampos()">Limpar</button>

    </form>

    <h2 id = "resultado"></h2>

    <script>
        function calcularMedia(){
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);
            const nota3 = parseFloat(document.getElementById('nota3').value);
            const nota4 = parseFloat(document.getElementById('nota4').value);

            const media = (nota1+nota2+nota3+nota4) / 4;

            const resultado = document.getElementById('resultado');

            if (media >= 7) {
                resultado.innerHTML = `Sua média é: ${media.toFixed(2)} e você foi Aprovado! PARABÉNS`;
                resultado.style.color = 'green';

            }else{

                resultado.innerHTML = `Sua média é: ${media.toFixed(2)} e você foi Reprovado! ESTUDE MAIS`;
                resultado.style.color = 'red';
            }            
        }

        function limparCampos(){
                document.getElementById('formNotas').reset();// Para limpar os inputs
                document.getElementById('resultado').innerHTML = ''; // limpar o resultado
            }                       
            
    </script>
    
 </body>
 </html>
